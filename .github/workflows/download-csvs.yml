name: Download Hotel Data and Deploy Dashboards

on:
  schedule:
    # Daily 22:30 UTC / 07:30 JST
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install numpy openpyxl

      - name: Update source data and rebuild dashboards
        env:
          GAS_CSV_PROXY_URL: ${{ secrets.GAS_CSV_PROXY_URL }}
        run: bash scripts/ci_update_dashboard.sh

      - name: Commit generated dashboard data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            "データ/ホテル口コミデータ/" \
            "データ/ホテル集計表XLSX/" \
            "データ/分析結果JSON/" \
            "ホームページ/" \
            "ホームページV2/" \
            "v2/" \
            *.html \
            data/ \
            scripts/ \
            styles/ \
            || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated changes to commit"
          else
            BUILD_DATE="$(node -e "console.log(require('./v2/data/build-meta.json').build_date)")"
            TOTAL_REVIEWS="$(node -e "console.log(require('./v2/data/build-meta.json').total_reviews)")"
            git commit -m "日次ダッシュボード最新化: ${BUILD_DATE} 口コミ${TOTAL_REVIEWS}件"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '_site'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - id: deployment
        uses: actions/deploy-pages@v4
